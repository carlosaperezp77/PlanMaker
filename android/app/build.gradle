plugins {
    id 'com.android.application'
}

android {
    namespace 'com.planmaker.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.planmaker.app'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '0.1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// La app web se copia desde dist/ (npm run build) como página principal.
def copyWeb = tasks.register('copyWeb', Copy) {
    from(rootProject.file('../dist/planmaker.html')) { rename { 'index.html' } }
    into layout.buildDirectory.dir('web/assets')
}
android.sourceSets.main.assets.srcDir(layout.buildDirectory.dir('web/assets'))
tasks.named('preBuild') { dependsOn copyWeb }

dependencies {
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.webkit:webkit:1.11.0'
}
