name: App de Android
on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run build
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle assembleDebug --no-daemon
        working-directory: android
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk PlanMaker.apk
      - uses: actions/upload-artifact@v4
        with:
          name: PlanMaker-apk
          path: PlanMaker.apk
